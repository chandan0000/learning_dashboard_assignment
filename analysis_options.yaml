include:
  - package:very_good_analysis/analysis_options.yaml
  - package:bloc_lint/recommended.yaml
analyzer:
  exclude:
    - lib/l10n/gen/*
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    public_member_api_docs: false
    # Single-method interfaces (AuthApi, NetworkInfo) are deliberate seams for
    # swapping implementations and mocking in tests.
    one_member_abstracts: false
